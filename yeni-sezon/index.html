<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mobven — Yeni Sezon</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <header class="site" id="site-header"></header>
  <main>
    <div class="hero small">
      <h1>Yeni Sezon</h1>
      <p>Koleksiyona yeni katılan parçalar.</p>
    </div>
    <div class="grid" id="product-grid"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="../webpush-client.js"></script>
  <script src="../assets/site.js"></script>
  <script>
    const ROOT = '../';
    MobvenSite.initPush(ROOT);
    MobvenSite.renderHeader(ROOT, 'yeni-sezon');
    MobvenSite.renderFooter();
    MobvenSite.renderProductGrid('product-grid', MobvenSite.getByBadge('yeni'), ROOT);
  </script>
</body>
</html>
