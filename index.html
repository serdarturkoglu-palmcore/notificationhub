<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mobven — Sonbahar/Kış Koleksiyonu</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site" id="site-header"></header>
  <main>
    <div class="hero">
      <h1>Sonbahar/Kış Koleksiyonu</h1>
      <p>Doğal kumaşlardan üretilen, mevsimlik yeni parçalar. Stoklar sınırlıdır.</p>
    </div>
    <p class="section-title">Öne Çıkanlar</p>
    <div class="grid" id="product-grid"></div>
  </main>
  <footer class="site" id="site-footer"></footer>

  <script src="webpush-client.js"></script>
  <script src="assets/site.js"></script>
  <script>
    const ROOT = '';
    MobvenSite.initPush(ROOT);
    MobvenSite.renderHeader(ROOT, null);
    MobvenSite.renderFooter();
    MobvenSite.renderProductGrid('product-grid', MobvenSite.getCatalog(), ROOT);
  </script>
</body>
</html>
